<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>English A0 → A2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="theme.css?v=3">
</head>
<body>
<header>
  <div class="brand"><span class="mark">EN</span><div class="title" id="hTitle">English</div></div>
  <div class="streak" id="hStreak"></div>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-go="course">
    <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H18a1 1 0 0 1 1 1v13"/><path d="M4 5.5V17a3 3 0 0 0 3 3h12"/><path d="M7 8h8"/></svg>
    Курс</button>
  <button data-go="dict">
    <svg viewBox="0 0 24 24"><path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5"/><path d="M8.5 13.5 11 18l2.5-4.5"/></svg>
    Словарь</button>
  <button data-go="errors">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v6"/><circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/></svg>
    Ошибки</button>
  <button data-go="progress">
    <svg viewBox="0 0 24 24"><path d="M4 17l5-6 4 4 7-8"/><path d="M20 7h-4M20 7v4"/></svg>
    Прогресс</button>
</nav>

<script src="data.js?v=5"></script>
<script src="exercises.js?v=1"></script>
<script src="theory.js?v=1"></script>
<script>
/* ---------- хранилище ---------- */
const KEY = 'en_app_v1';
const blank = { done:{}, errors:[], log:{}, answers:{}, hw:{}, murphyAns:{}, given:{}, tests:{} };
let S = load();
function load(){
  try { return Object.assign({}, blank, JSON.parse(localStorage.getItem(KEY) || '{}')); }
  catch(e){ return JSON.parse(JSON.stringify(blank)); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function dayKey(d){
  const x = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return x.toISOString().slice(0,10);
}
function today(){ return dayKey(new Date()); }
function markDay(){ const d = today(); S.log[d] = (S.log[d] || 0) + 1; save(); }
function streak(){
  let n = 0;
  const d = new Date();
  if (!S.log[today()]) d.setDate(d.getDate()-1);
  for(;;){
    if (!S.log[dayKey(d)]) break;
    n++;
    d.setDate(d.getDate()-1);
    if (n > 400) break;
  }
  return n;
}

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const SPEAKER_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13L7.2 14.5H4z"/>' +
  '<path d="M15.4 8.6a4.8 4.8 0 0 1 0 6.8"/><path d="M17.9 6a8.4 8.4 0 0 1 0 12"/></svg>';
function audioButton(text, label, compact){
  return '<button class="btn audio-btn' + (compact ? ' compact' : '') + '" type="button" data-speak="' + esc(text) +
    '" aria-label="' + esc(label) + '">' + SPEAKER_ICON + (compact ? '' : '<span>Слушать</span>') + '</button>';
}
function pickEnglishVoice(){
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  const english = voices.filter(v => (v.lang || '').toLowerCase().startsWith('en'));
  const natural = english.filter(v => /natural|neural|google|microsoft/i.test(v.name));
  return natural.find(v => /^en[-_]gb/i.test(v.lang)) ||
    natural.find(v => /^en/i.test(v.lang)) ||
    english.find(v => /^en[-_]gb/i.test(v.lang)) ||
    english[0] || null;
}
let AUDIO_INDEX = null;
let AUDIO_PLAYER = null;
function loadAudioIndex(){
  fetch('audio/manifest.json', { cache:'no-store' })
    .then(r => r.ok ? r.json() : null)
    .then(data => { if (data && data.items) AUDIO_INDEX = data.items; })
    .catch(() => {});
}
function playAudio(text, slow){
  const file = AUDIO_INDEX && AUDIO_INDEX[text];
  if (file){
    if (AUDIO_PLAYER){
      AUDIO_PLAYER.pause();
      AUDIO_PLAYER = null;
    }
    const player = new Audio(file);
    player.playbackRate = slow ? 0.72 : 1;
    player.play().catch(() => speakText(text));
    AUDIO_PLAYER = player;
    return;
  }
  speakText(text, slow);
}
function speakText(text, slow){
  if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-GB';
  utterance.rate = slow ? 0.66 : 0.86;
  const voice = pickEnglishVoice();
  if (voice) utterance.voice = voice;
  window.speechSynthesis.speak(utterance);
}
function prepareVoices(){
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.getVoices();
  window.speechSynthesis.addEventListener('voiceschanged', () => pickEnglishVoice());
}
function wireAudio(root){
  root.querySelectorAll('[data-speak]').forEach(button => {
    button.addEventListener('click', () => playAudio(button.dataset.speak, button.dataset.slow === '1'));
  });
}
function norm(s){
  return String(s).toLowerCase()
    .replace(/[’`]/g,"'")
    .replace(/[.,!?;:«»"]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function lessonById(id){ return LESSONS.find(l => l.id === id); }
function allWords(){
  const seen = new Set(), out = [];
  LESSONS.forEach(l => (l.words||[]).forEach(w => {
    if (seen.has(w.w)) return; seen.add(w.w); out.push(Object.assign({lesson:l.title}, w));
  }));
  return out;
}
function lessonScore(id){
  const a = S.answers[id]; if(!a) return null;
  const total = Object.keys(a).length, ok = Object.values(a).filter(Boolean).length;
  return { total, ok, pct: total ? Math.round(ok*100/total) : 0 };
}
function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
function hwItems(l){ return l.homework ? l.homework.reduce((s, b) => s + b.items.length, 0) : 0; }
function bookItems(l){ return ((window.BOOK_EXERCISES || {})[l.id] || []).length; }
function lessonTotal(l){ return l.exercises.length + hwItems(l) + (l.listening || []).length + bookItems(l); }

/* ---------- маршрутизация ---------- */
function go(view, param){
  location.hash = param ? view + '/' + param : view;
}
window.addEventListener('hashchange', route);
let currentView = 'course', currentParam = null;
function route(){
  const raw = location.hash.replace(/^#/, '');
  const anchor = raw.startsWith('s-') ? raw : null;
  const parts = raw.split('/').filter(Boolean);
  const view = anchor ? currentView : (parts[0] || 'course');
  const param = anchor ? currentParam : parts[1];
  if (!anchor){
    currentView = view;
    currentParam = param;
    render(view, param);
  }
  const focusMode = view === 'play' || view === 'test';
  document.body.classList.toggle('playing', focusMode);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.go === (focusMode ? 'course' : view)));
  if (anchor){
    const el = document.getElementById(anchor);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
  } else {
    window.scrollTo(0,0);
  }
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));

function header(title){
  $('#hTitle').textContent = title;
  const st = streak();
  $('#hStreak').innerHTML = st ? 'серия <b>' + st + '</b> дн.' : 'начни сегодня';
}

/* ---------- экраны ---------- */
function render(view, param){
  if (view === 'lesson') return renderLesson(param);
  if (view === 'dict') return renderDict();
  if (view === 'errors') return renderErrors();
  if (view === 'progress') return renderProgress();
  if (view === 'test') return renderTest(param);
  if (view === 'play') return renderPlay(param);
  return renderCourse();
}

function nextLesson(){
  return LESSONS.find(l => !S.done[l.id]) || LESSONS[LESSONS.length - 1];
}
function todayCount(){ return S.log[today()] || 0; }
function answeredCount(l){ return Object.keys(S.answers[l.id] || {}).length; }

function renderCourse(){
  header('Курс');
  const all = LESSONS.length;
  const done = LESSONS.filter(l => S.done[l.id]).length;
  const next = nextLesson();
  const nextDone = answeredCount(next), nextTotal = lessonTotal(next);
  const nextPct = nextTotal ? Math.round(nextDone * 100 / nextTotal) : 0;
  const goal = 10, todayN = Math.min(todayCount(), goal);

  let html = '<div class="home-hero"><div class="eyebrow">A0 → A2 · по 20–30 минут</div>' +
    '<h1>Английский с нуля</h1>' +
    '<p class="muted">Один юнит — несколько коротких занятий. Слова повторяй в Anki, здесь — правило, звук и практика.</p></div>';

  html += '<div class="today-card">' +
    '<div class="today-head"><span class="eyebrow">Следующий урок</span>' +
    '<span class="streak-pill">🔥 ' + plural(streak(), 'день', 'дня', 'дней') + '</span></div>' +
    '<div class="today-main"><span class="today-num">' + String(next.unit).padStart(2,'0') + '</span>' +
    '<div><b>Unit ' + next.unit + '. ' + esc(next.title) + '</b>' +
    '<div class="muted small">' + esc(next.subtitle) + '</div></div></div>' +
    '<div class="today-bar"><div class="row"><span class="small muted">Отвечено ' + nextDone + ' из ' + nextTotal + '</span>' +
    '<span class="small muted">≈ ' + Math.ceil(nextTotal / SESSION_SIZE) + ' ' + plural(Math.ceil(nextTotal / SESSION_SIZE), 'занятие', 'занятия', 'занятий') + '</span></div><div class="bar"><i style="width:' + nextPct + '%"></i></div></div>' +
    '<a class="btn primary xl" href="#play/' + next.id + '">' + (nextDone ? 'Продолжить занятие' : 'Начать занятие') + '</a>' +
    '<div class="today-links"><a href="#lesson/' + next.id + '">Правило и слова</a><a href="#test/b1">Тест блока</a></div>' +
    '</div>';

  html += '<div class="daily-goal"><div class="daily-dots">';
  for (let i = 0; i < goal; i++) html += '<span class="' + (i < todayN ? 'on' : '') + '"></span>';
  html += '</div><div><b>' + (todayN >= goal ? 'Цель дня выполнена' : 'Цель дня') + '</b>' +
    '<div class="muted small">' + todayN + ' из ' + goal + ' проверок</div></div></div>';

  html += '<div class="section-head"><h2>Путь</h2><span class="muted small">' + done + ' из ' + all + ' уроков</span></div>';

  BLOCKS.forEach(b => {
    const ls = LESSONS.filter(l => l.block === b.id);
    if (!ls.length) return;
    const tr = S.tests && S.tests[b.id];
    html += '<div class="path-block"><div class="path-title"><b>' + esc(b.title) + '</b>' +
      '<span class="muted small">' + esc(b.weeks) + '</span></div>' +
      '<p class="muted small path-goal">' + esc(b.goal) + '</p><div class="path">';

    ls.forEach(l => {
      const sc = lessonScore(l.id);
      const pct = sc ? sc.pct : 0;
      const state = S.done[l.id] ? 'done' : (l.id === next.id ? 'current' : '');
      html += '<a class="node ' + state + '" href="#lesson/' + l.id + '">' +
        '<span class="node-dot">' + (S.done[l.id]
          ? '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
          : l.unit) + '</span>' +
        '<span class="node-info"><b>Unit ' + l.unit + '. ' + esc(l.title) + '</b>' +
        '<small>' + esc(l.subtitle) + '</small>' +
        '<span class="node-sub"><span>' + lessonTotal(l) + ' ' + plural(lessonTotal(l), 'задание', 'задания', 'заданий') + '</span>' +
        '<span>' + (S.done[l.id] ? 'пройден · ' + pct + '%' : (sc ? pct + '%' : 'не начат')) + '</span></span></span>' +
        '<span class="node-arrow">' + (state === 'current' ? '▶' : '→') + '</span></a>';
    });

    html += '<a class="node test ' + (tr && tr.pct >= 80 ? 'done' : '') + '" href="#test/' + b.id + '">' +
      '<span class="node-dot">★</span><span class="node-info"><b>Тест блока</b>' +
      '<small>' + TEST_SIZE + ' вопросов · нужно 80%</small>' +
      '<span class="node-sub"><span>' + (tr ? 'результат ' + tr.pct + '%' : 'не пройден') + '</span></span></span>' +
      '<span class="node-arrow">→</span></a>';
    html += '</div></div>';
  });

  const future = BLOCKS.filter(b => !LESSONS.some(l => l.block === b.id));
  if (future.length){
    html += '<div class="section-head"><h2>Дальше</h2><span class="muted small">по мере прохождения</span></div>' +
      '<div class="future-list">' + future.map(b => '<div class="future"><b>' + esc(b.title) + '</b>' +
      '<span class="muted small">' + esc(b.units) + '</span></div>').join('') + '</div>';
  }

  html += '<div class="footnote"><b>План занятия на 25 минут</b>' +
    '<p class="small muted">5 минут Anki · 8 минут правило и слова · 10 минут задания · 2 минуты итог.</p></div>';

  $('#view').innerHTML = html;
}

function theoryHtml(l){
  const theory = (window.THEORY_EXTRA && window.THEORY_EXTRA[l.id]) || l.sections || l.theory || [];
  let html = '';
  theory.forEach(t => {
    if (t.h) html += '<h2>' + esc(t.h) + '</h2>';
    if (t.p) html += '<p>' + t.p + '</p>';
    if (t.table){
      html += '<table><thead><tr>' + t.table[0].map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
        t.table.slice(1).map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') +
        '</tbody></table>';
    }
  });
  return html;
}
function renderLesson(id){
  const l = lessonById(id);
  if (!l) { go('course'); return; }
  header('Unit ' + l.unit);
  let html = '<button class="back" onclick="go(\'course\')">← к курсу</button>';
  html += '<h1>Unit ' + l.unit + '. ' + esc(l.title) + '</h1><p class="muted">' + esc(l.subtitle) + '</p>' +
    '<div class="meta"><span>' + l.words.length + ' ' + plural(l.words.length, 'слово', 'слова', 'слов') + '</span>' +
    '<span>' + lessonTotal(l) + ' ' + plural(lessonTotal(l), 'задание', 'задания', 'заданий') + '</span>' +
    '<span>≈ ' + Math.ceil(lessonTotal(l) / SESSION_SIZE) + ' ' + plural(Math.ceil(lessonTotal(l) / SESSION_SIZE), 'занятие', 'занятия', 'занятий') + '</span></div>' +
    '<a class="btn primary xl lesson-start" href="#play/' + l.id + '">Начать занятие</a>';

  html += '<div class="chips">' +
    '<a class="chip" href="#s-notes">Правило</a>' +
    '<a class="chip" href="#s-words">Слова</a>' +
    (l.listening && l.listening.length ? '<a class="chip" href="#s-listening">Слушаем</a>' : '') +
    (bookItems(l) ? '<a class="chip" href="#s-bookwork">Практика</a>' : '') +
    (l.homework ? '<a class="chip" href="#s-trainer">Тренажёр</a>' : '') +
    '<a class="chip" href="#s-extra">Дополнительно</a>' +
    (l.murphy ? '<a class="chip" href="#s-book">Книга</a>' : '') + '</div>';

  html += '<div id="s-notes">' + theoryHtml(l) + '</div>';

  html += '<h3 id="s-words">Слова урока</h3><div class="card">' + l.words.map(w =>
    '<div class="word"><div class="row"><div><span class="w">' + esc(w.w) + '</span><div class="tr">' + esc(w.tr) + '</div></div>' +
    audioButton(w.w, 'Слушать слово ' + w.w, true) + '</div>' +
    '<div>' + esc(w.ru) + '</div><div class="ex2 muted">' + esc(w.ex) + ' — ' + esc(w.exRu) + '</div></div>').join('') + '</div>';

  html += '<h3>Примеры</h3><div class="card">' + l.examples.map(e =>
    '<div class="word"><div class="row"><span class="phrase">' + esc(e.en) + '</span>' + audioButton(e.en, 'Слушать фразу', true) + '</div>' +
    '<div class="ex2 muted">' + esc(e.ru) + '</div></div>').join('') + '</div>';

  if (l.listening && l.listening.length){
    html += '<h2 id="s-listening">Аудирование</h2><p class="muted small">Сначала нажми «Слушать», не подглядывай в английскую фразу и выбери перевод. Можно переслушать.</p>' +
      '<div id="listenWrap"></div>';
  }

  if (bookItems(l)){
    html += '<h2 id="s-bookwork">Практика по юниту</h2>' +
      '<p class="muted small">Задания на ту же грамматику, что в книге, но с проверкой и без переписывания страниц.</p>' +
      '<div id="bookWrap"></div>';
  }

  if (l.homework) html += trainerBlock(l);

  html += '<h2 id="s-extra">Дополнительно</h2><p class="muted small">Мои упражнения на те же темы. Пиши полностью, без сокращений.</p>';
  html += '<div id="exWrap"></div>';
  html += '<div id="trainWrap"></div>';
  html += '<div id="lessonEnd"></div>';
  if (l.murphy) html += murphyBlock(l);
  $('#view').innerHTML = html;
  wireAudio($('#view'));

  if (bookItems(l)){
    const bookWrap = $('#bookWrap');
    ((window.BOOK_EXERCISES || {})[l.id] || []).forEach((ex, i) => {
      const key = 'b' + i;
      const savedText = S.given && S.given[l.id + '|' + key];
      const savedOk = !!(S.answers[l.id] && S.answers[l.id][key]);
      const restore = savedText ? { given: savedText, ok: savedOk } : null;
      bookWrap.appendChild(exCard(ex, (ok, given, correct) => {
        record(l.id, key, ok, ex, given, correct);
        refreshLessonEnd(l);
      }, restore));
    });
  }

  if (l.listening && l.listening.length){
    const listenWrap = $('#listenWrap');
    l.listening.forEach((ex, i) => {
      const key = 'a' + i;
      const savedText = S.given && S.given[l.id + '|' + key];
      const savedOk = !!(S.answers[l.id] && S.answers[l.id][key]);
      const restore = savedText ? { given: savedText, ok: savedOk } : null;
      listenWrap.appendChild(exCard(ex, (ok, given, correct) => {
        record(l.id, key, ok, ex, given, correct);
        refreshLessonEnd(l);
      }, restore));
    });
  }

  const wrap = $('#exWrap');
  l.exercises.forEach((ex, i) => {
    const key = 'u' + i;
    const savedText = S.given && S.given[l.id + '|' + key];
    const savedOk = !!(S.answers[l.id] && S.answers[l.id][key]);
    const restore = savedText ? { given: savedText, ok: savedOk } : null;
    wrap.appendChild(exCard(ex, (ok, given, correct) => {
      record(l.id, key, ok, ex, given, correct);
      refreshLessonEnd(l);
    }, restore));
  });

  if (l.homework){
    $('#trainWrap').innerHTML = '';
    wireTrainer(l);
  }

  refreshLessonEnd(l);
}

function refreshLessonEnd(l){
  const host = $('#lessonEnd');
  if (!host) return;
  const st = lessonScore(l.id), total = lessonTotal(l);
  if (!st){
    host.innerHTML = '';
  } else if (st.total >= total){
    host.innerHTML = '<div class="card"><b>' + (st.pct >= 80 ? 'Урок пройден: ' : 'Ответы есть, но порог не набран: ') + st.pct + '%</b>' +
      '<p class="muted small">' + (st.pct >= 80
        ? 'Можно возвращаться завтра. Ошибки из журнала повтори отдельно.'
        : 'Нужно 80% верных, чтобы урок считался пройденным. Разбери ошибки во вкладке «Ошибки» и вернись к уроку позже.') + '</p></div>';
  } else {
    host.innerHTML = '<p class="muted small">Отвечено ' + st.total + ' из ' + total +
      '. Можно остановиться и продолжить завтра: ответы сохраняются.</p>';
  }
}

/* ---------- режим занятия ---------- */
let PLAY = null;
function buildQueue(l){
  const q = [];
  (l.listening || []).forEach((ex, i) => q.push({ key:'a' + i, section:'Аудирование', ex }));
  ((window.BOOK_EXERCISES || {})[l.id] || []).forEach((ex, i) =>
    q.push({ key:'b' + i, section:ex.group || 'Практика', ex }));
  (l.homework || []).forEach(g => g.items.forEach((it, ii) => q.push({
    key:'h' + g.id + '.' + ii, section:g.task,
    ex:{ type:'fill', q:it.q, answers:it.a, explain:it.explain, sample:it.sample }
  })));
  (l.exercises || []).forEach((ex, i) => q.push({ key:'u' + i, section:'Повторение', ex }));
  return q;
}
const SESSION_SIZE = 8;
const MAX_TRIES = 5;
function hintFor(correct, attempt){
  const words = String(correct || '').trim().split(/\s+/).filter(Boolean);
  if (attempt === 2) return 'Слов в ответе: ' + words.length + '. Первое начинается на «' +
    (words[0] || '').slice(0,1).toUpperCase() + '».';
  if (attempt === 3) return 'Начало ответа: «' + cap(words.slice(0,2).join(' ')) + '…».';
  if (attempt === 4) return 'Последняя попытка. Проверь порядок слов и форму глагола.';
  return '';
}
function renderPlay(id){
  const l = lessonById(id);
  if (!l){ go('course'); return; }
  const all = buildQueue(l);
  if (!all.length){ go('lesson/' + id); return; }
  const unanswered = all.filter(it => !(S.answers[l.id] && S.answers[l.id][it.key] !== undefined));
  const queue = (unanswered.length ? unanswered : all).slice(0, SESSION_SIZE);
  header('Unit ' + l.unit);
  PLAY = { l, queue, all, idx:0, right:0, total:0, attempts:0, resolved:false, pick:null };
  renderPlayCard();
}
function playProgress(l, queue){
  const answered = queue.filter(it => S.answers[l.id] && S.answers[l.id][it.key] !== undefined).length;
  return { answered, total:queue.length, pct:queue.length ? Math.round(answered*100/queue.length) : 0 };
}
function renderPlayCard(){
  if (!PLAY){ go('course'); return; }
  const l = PLAY.l, queue = PLAY.queue;
  if (PLAY.idx >= queue.length) return renderPlayDone();
  const item = queue[PLAY.idx], ex = item.ex;
  const doneInSession = Math.round(PLAY.idx * 100 / queue.length);
  let html = '<div class="player">' +
    '<div class="player-top"><button class="icon-btn" onclick="go(\'lesson/' + l.id + '\')" aria-label="Выйти">×</button>' +
    '<div class="player-progress"><i style="width:' + doneInSession + '%"></i></div>' +
    '<span class="player-count">' + (PLAY.idx + 1) + '/' + queue.length + '</span>' +
    '<button class="icon-btn rule-btn" onclick="showRule()" aria-label="Правило">?</button></div>' +
    '<div class="player-body"><span class="eyebrow">' + esc(item.section) + '</span>' +
    '<h2 class="task-q">' + esc(ex.q) + '</h2>';
  if (ex.audio){
    html += '<div class="listen-row">' +
      '<button class="btn listen-big" data-speak="' + esc(ex.audio) + '">' + SPEAKER_ICON + '<span>Слушать</span></button>' +
      '<button class="btn ghost" data-speak="' + esc(ex.audio) + '" data-slow="1">Медленно</button></div>';
  }
  if (ex.type === 'choice'){
    html += '<div class="opts play-opts">' + ex.opts.map((o, i) =>
      '<button class="opt" data-pick="' + i + '">' + esc(o) + '</button>').join('') + '</div>';
  } else {
    html += '<input class="play-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' +
      (ex.audio ? 'запиши услышанное' : 'ответ по-английски') + '">';
  }
  html += '<div class="fb play-fb" id="playFb" role="status" aria-live="polite"></div></div>' +
    '<div class="player-actions"><button class="btn ghost" id="playSkip">Пропустить</button>' +
    '<button class="btn primary xl" id="playCheck">Проверить</button></div></div>';
  $('#view').innerHTML = html;
  wireAudio($('#view'));
  const input = $('.play-input');
  if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') checkPlay(); });
  if (ex.type === 'choice'){
    document.querySelectorAll('[data-pick]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (PLAY.resolved) return;
        document.querySelectorAll('[data-pick]').forEach(b => b.classList.remove('sel'));
        btn.classList.add('sel');
        PLAY.pick = Number(btn.dataset.pick);
      });
    });
  }
  $('#playCheck').addEventListener('click', checkPlay);
  $('#playSkip').addEventListener('click', () => {
    PLAY.idx++; PLAY.attempts = 0; PLAY.resolved = false; PLAY.pick = null; renderPlayCard();
  });
}
function showRule(){
  if (!PLAY) return;
  const l = PLAY.l;
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = '<div class="sheet-panel"><div class="sheet-head"><b>Unit ' + l.unit + '. ' + esc(l.title) + '</b>' +
    '<button class="icon-btn" aria-label="Закрыть">×</button></div>' +
    '<div class="sheet-body">' + theoryHtml(l) + '</div></div>';
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.remove(); });
  sheet.querySelector('.icon-btn').addEventListener('click', () => sheet.remove());
  document.body.appendChild(sheet);
}
function checkPlay(){
  if (!PLAY || PLAY.resolved) return;
  const item = PLAY.queue[PLAY.idx], ex = item.ex;
  let ok = false, given = '', correct = '';
  if (ex.type === 'choice'){
    if (PLAY.pick == null) return;
    given = ex.opts[PLAY.pick];
    correct = ex.opts[ex.answer];
    ok = PLAY.pick === ex.answer;
    if (!ok){
      const chosen = document.querySelectorAll('[data-pick]')[PLAY.pick];
      if (chosen){ chosen.disabled = true; chosen.classList.add('bad'); }
      PLAY.pick = null;
    }
  } else {
    const input = $('.play-input');
    given = input.value.trim();
    if (!given) return;
    ok = (ex.answers || ex.a || []).some(a => norm(a) === norm(given));
    correct = (ex.answers || ex.a || [])[0] || '';
    if (!ok) input.style.borderColor = '#5a2f2c';
  }
  if (ok) return resolvePlay(item, ex, given, correct, true);
  PLAY.attempts++;
  if (PLAY.attempts < MAX_TRIES){
    const fb = $('#playFb');
    fb.className = 'fb play-fb show no';
    const hint = ex.type === 'choice' ? 'Этот вариант не подходит. Попробуй другой.' : hintFor(correct, PLAY.attempts);
    fb.innerHTML = '<b>Пока не так.</b> Попытка ' + PLAY.attempts + ' из ' + MAX_TRIES + '.' +
      (hint ? '<br>' + esc(hint) : '');
    return;
  }
  resolvePlay(item, ex, given, correct, false);
}
function resolvePlay(item, ex, given, correct, ok){
  PLAY.resolved = true;
  document.querySelectorAll('[data-pick]').forEach((b, i) => {
    b.disabled = true;
    if (i === ex.answer) b.classList.add('good');
  });
  const input = $('.play-input');
  if (input) input.disabled = true;
  PLAY.total++; if (ok) PLAY.right++;
  markAnswer(PLAY.l.id, item.key, ok, ex.q, given, correct);
  const fb = $('#playFb');
  fb.className = 'fb play-fb show ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? '<b>Верно.</b> ' + esc(ex.explain || ex.sample || '')
    : 'Попытки закончились. Правильно: <span class="corr">' + esc(cap(correct)) + '</span>' +
      (ex.explain ? '<br>' + esc(ex.explain) : '');
  const actions = document.querySelector('.player-actions');
  actions.innerHTML = '<button class="btn primary xl" id="playNext">' +
    (PLAY.idx + 1 >= PLAY.queue.length ? 'Завершить' : 'Дальше') + '</button>';
  $('#playNext').addEventListener('click', () => {
    PLAY.idx++; PLAY.attempts = 0; PLAY.resolved = false; PLAY.pick = null; renderPlayCard();
  });
  $('#playNext').focus();
}
function renderPlayDone(){
  const l = PLAY.l, all = PLAY.all;
  const pr = playProgress(l, all);
  const pct = PLAY.total ? Math.round(PLAY.right * 100 / PLAY.total) : pr.pct;
  const left = all.length - pr.answered;
  $('#view').innerHTML = '<div class="player done"><div class="done-card">' +
    '<div class="done-badge">✓</div><h2 class="done-title">Занятие закончено</h2>' +
    '<p class="muted">' + (PLAY.total ? PLAY.right + ' из ' + PLAY.total + ' верно в этом заходе' : 'Все задания уже отвечены') + '</p>' +
    '<div class="done-score">' + pct + '%</div>' +
    '<p class="small muted">Урок пройден на ' + pr.answered + ' из ' + all.length + ' заданий' +
    (left > 0 ? '. Осталось ещё ' + left + ' — можно продолжить в следующий раз.' : '. Это был последний заход.') + '</p>' +
    (left > 0 ? '<a class="btn primary xl" href="#play/' + l.id + '">Продолжить занятие</a>' : '') +
    '<a class="btn ghost full" href="#lesson/' + l.id + '">К правилу и словам</a>' +
    '<a class="btn ghost full" href="#course">На главную</a>' +
    '</div></div>';
}

function exCard(ex, onAnswer, restore, once){
  const div = document.createElement('div');
  let resolved = !!restore;
  let attempts = 0;
  div.className = 'ex';
  if (ex.guide) div.innerHTML += '<div class="test-guide">' + esc(ex.guide) + '</div>';
  else if (ex.group) div.innerHTML += '<div class="test-guide">' + esc(ex.group) + '</div>';
  div.innerHTML += '<p class="q">' + esc(ex.q) + '</p>';
  if (ex.audio) div.innerHTML += audioButton(ex.audio, 'Слушать фразу');

  if (ex.type === 'choice'){
    div.innerHTML += '<div class="opts">' +
      ex.opts.map((o, i) => '<button class="opt" data-i="' + i + '">' + esc(o) + '</button>').join('') +
      '</div><div class="fb"></div>';
    div.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => {
        if (resolved) return;
        const i = Number(btn.dataset.i), right = i === ex.answer;
        div.querySelectorAll('.opt').forEach(b => b.classList.remove('sel'));
        btn.classList.add('sel');
        if (right){
          resolved = true;
          div.querySelectorAll('.opt').forEach(b => { b.disabled = true; });
          btn.classList.remove('sel');
          btn.classList.add('good');
          showFb(div, true, ex.opts[ex.answer], ex.explain);
          onAnswer(true, ex.opts[i], ex.opts[ex.answer]);
          return;
        }
        attempts++;
        btn.disabled = true;
        btn.classList.remove('sel');
        btn.classList.add('bad');
        if (attempts >= MAX_TRIES){
          resolved = true;
          div.querySelectorAll('.opt').forEach(b => { b.disabled = true; });
          div.querySelectorAll('.opt')[ex.answer].classList.add('good');
          showFb(div, false, ex.opts[ex.answer], ex.explain);
          onAnswer(false, ex.opts[i], ex.opts[ex.answer]);
        } else {
          const fb = div.querySelector('.fb');
          fb.className = 'fb show no';
          fb.innerHTML = '<b>Пока не так.</b> Попытка ' + attempts + ' из ' + MAX_TRIES +
            '.<br>Этот вариант не подходит. Попробуй другой.';
        }
      });
    });
    if (restore && restore.given){
      const i = ex.opts.findIndex(o => norm(o) === norm(restore.given));
      if (i >= 0){
        const buttons = Array.from(div.querySelectorAll('.opt'));
        buttons.forEach(b => { b.disabled = true; });
        buttons[i].classList.add(i === ex.answer ? 'good' : 'bad');
        if (i !== ex.answer) buttons[ex.answer].classList.add('good');
        showFb(div, restore.ok, ex.opts[ex.answer], ex.explain);
      }
    }
    wireAudio(div);
    return div;
  }

  const placeholder = ex.audio ? 'запиши фразу по-английски' : 'ответ по-английски';
  div.innerHTML += '<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' + placeholder + '">' +
    '<div class="row" style="margin-top:8px"><button class="btn primary check-btn">Проверить</button></div><div class="fb"></div>';
  const inp = div.querySelector('input');
  const check = () => {
    if (resolved) return;
    const val = inp.value.trim();
    if (!val) return;
    const ok = ex.answers.some(a => norm(a) === norm(val));
    if (ok){
      resolved = true;
      inp.disabled = true;
      inp.style.borderColor = '#2e4a3a';
      showFb(div, true, ex.answers[0], ex.explain);
      onAnswer(true, val, ex.answers[0]);
      return;
    }
    attempts++;
    inp.style.borderColor = '#4a2e2e';
    if (attempts >= MAX_TRIES){
      resolved = true;
      inp.disabled = true;
      showFb(div, false, ex.answers[0], ex.explain);
      onAnswer(false, val, ex.answers[0]);
    } else {
      const fb = div.querySelector('.fb');
      fb.className = 'fb show no';
      fb.innerHTML = '<b>Пока не так.</b> Попытка ' + attempts + ' из ' + MAX_TRIES + '.' +
        (hintFor(ex.answers[0], attempts) ? '<br>' + esc(hintFor(ex.answers[0], attempts)) : '');
    }
  };
  div.querySelector('.check-btn').addEventListener('click', check);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  if (restore && restore.given){
    inp.value = restore.given;
    inp.disabled = true;
    inp.style.borderColor = restore.ok ? '#2e4a3a' : '#4a2e2e';
    showFb(div, restore.ok, ex.answers[0], ex.explain);
  }
  wireAudio(div);
  return div;
}

function showFb(div, ok, correct, explain){
  const fb = div.querySelector('.fb');
  fb.className = 'fb show ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? '<b>Верно.</b> ' + esc(explain || '')
    : 'Не так. Правильно: <span class="corr">' + esc(cap(correct)) + '</span><br>' + esc(explain || '');
}
function cap(s){ return s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : s; }

function record(lessonId, key, ok, ex, given, correct){
  markAnswer(lessonId, key, ok, ex.q, given, correct);
}

function markAnswer(lessonId, key, ok, q, given, correct){
  if (!S.answers[lessonId]) S.answers[lessonId] = {};
  S.answers[lessonId][key] = ok;
  if (!S.given) S.given = {};
  S.given[lessonId + '|' + key] = given;
  if (!ok){
    const dup = S.errors.some(e => e.q === q && e.date === today());
    if (!dup) S.errors.unshift({ date: today(), lesson: lessonId, q, given, correct });
  }
  markDay();
  const l = lessonById(lessonId);
  if (l){
    const sc = lessonScore(lessonId);
    if (sc && sc.total >= lessonTotal(l) && sc.pct >= 80){
      S.done[lessonId] = S.done[lessonId] || { date: today() };
    } else {
      delete S.done[lessonId];
    }
  }
  save();
  refreshStreak();
}

function refreshStreak(){
  const st = streak();
  $('#hStreak').innerHTML = st ? 'серия <b>' + st + '</b> дн.' : 'начни сегодня';
}

function wireTrainer(l){
  l.homework.forEach((blk, bi) => {
    const host = document.getElementById('hwb-' + bi);
    const badge = document.getElementById('tb-' + bi);
    const marks = [];
    if (badge) badge.textContent = '0 из ' + blk.items.length;

    blk.items.forEach((it, ii) => {
      const key = 'h' + blk.id + '.' + ii;
      const row = document.createElement('div');
      row.className = 'hwrow';
      row.innerHTML = '<div class="hwq">' + (ii + 1) + '. ' + esc(it.q) + '</div>' +
        '<div class="row"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ответ">' +
        '<button class="btn">ОК</button><span class="mark"></span></div><div class="fb"></div>';

      const inp = row.querySelector('input');
      const mark = row.querySelector('.mark');
      const fb = row.querySelector('.fb');
      let resolved = false, attempts = 0;
      const showMark = (ok) => {
        mark.textContent = ok ? '✓' : '✕';
        mark.style.color = ok ? 'var(--accent)' : 'var(--bad)';
      };
      const check = (silent) => {
        if (resolved && !silent) return;
        const v = inp.value.trim();
        if (!v) return;
        const ok = it.a.some(x => norm(x) === norm(v));
        inp.style.borderColor = ok ? '#2e4a3a' : '#4a2e2e';
        if (silent){
          resolved = true;
          inp.disabled = true;
          showMark(ok);
          if (!ok){
            fb.className = 'fb show no';
            fb.innerHTML = 'Верно: <span class="corr">' + esc(cap(it.a[0])) + '</span>';
          } else if (it.sample){
            fb.className = 'fb show ok';
            fb.innerHTML = 'Образец: ' + esc(it.sample);
          }
          marks[ii] = ok;
          const restoredDone = marks.filter(Boolean).length;
          if (badge){
            badge.textContent = restoredDone + ' из ' + blk.items.length;
            badge.className = 'badge' + (restoredDone === blk.items.length ? ' ok' : '');
          }
          return;
        }
        if (ok){
          resolved = true;
          inp.disabled = true;
          showMark(true);
          marks[ii] = true;
          const done = marks.filter(Boolean).length;
          if (badge){
            badge.textContent = done + ' из ' + blk.items.length;
            badge.className = 'badge' + (done === blk.items.length ? ' ok' : '');
          }
          if (it.sample){
            fb.className = 'fb show ok';
            fb.innerHTML = 'Образец: ' + esc(it.sample);
          } else {
            fb.className = 'fb';
          }
          markAnswer(l.id, key, true, it.q, v, it.a[0]);
          refreshLessonEnd(l);
          return;
        }
        attempts++;
        showMark(false);
        if (attempts >= MAX_TRIES){
          resolved = true;
          inp.disabled = true;
          fb.className = 'fb show no';
          fb.innerHTML = 'Попытки закончились. Верно: <span class="corr">' + esc(cap(it.a[0])) + '</span>';
          markAnswer(l.id, key, false, it.q, v, it.a[0]);
          refreshLessonEnd(l);
        } else {
          fb.className = 'fb show no';
          fb.innerHTML = '<b>Пока не так.</b> Попытка ' + attempts + ' из ' + MAX_TRIES + '.' +
            (hintFor(it.a[0], attempts) ? '<br>' + esc(hintFor(it.a[0], attempts)) : '');
        }
      };
      row.querySelector('.btn').addEventListener('click', () => check(false));
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(false); });
      host.appendChild(row);

      const saved = S.given && S.given[l.id + '|' + key];
      if (saved){ inp.value = saved; check(true); }
    });
  });
}

function renderProgress(){
  header('Прогресс');
  const days = Object.keys(S.log).sort();
  let answered = 0, right = 0;
  Object.values(S.answers).forEach(o => Object.values(o).forEach(v => { answered++; if (v) right++; }));
  const doneLessons = Object.keys(S.done || {}).length;
  const acc = answered ? Math.round(right*100/answered) : 0;

  const totals = LESSONS.reduce((a, l) => {
    a.total += lessonTotal(l);
    a.done += Object.keys(S.answers[l.id] || {}).length;
    return a;
  }, { total:0, done:0 });
  const overall = totals.total ? Math.min(100, Math.round(totals.done * 100 / totals.total)) : 0;

  let html = '<h1>Прогресс</h1><div class="kpi">' +
    '<div><b>' + streak() + '</b><span>дней подряд</span></div>' +
    '<div><b>' + doneLessons + '</b><span>уроков</span></div>' +
    '<div><b>' + acc + '%</b><span>верных</span></div></div>';

  html += '<div class="card overall-card"><div class="row"><b>Весь курс</b>' +
    '<span class="badge">' + overall + '%</span></div>' +
    '<div class="bar"><i style="width:' + overall + '%"></i></div>' +
    '<p class="muted small">' + Math.min(totals.done, totals.total) + ' из ' + totals.total + ' заданий в Unit 1–4.</p></div>';

  html += '<h2>Последние 14 дней</h2><div class="grid14">';
  for (let i = 13; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const k = dayKey(d);
    html += '<div class="day' + (S.log[k] ? ' on' : '') + '">' + d.getDate() + '</div>';
  }
  html += '</div>';

  html += '<h2>Уроки</h2>';
  LESSONS.forEach(l => {
    const sc = lessonScore(l.id);
    const pct = lessonTotal(l) ? Math.min(100, Math.round((sc ? sc.total : 0) * 100 / lessonTotal(l))) : 0;
    html += '<div class="card lesson-row"><div class="row"><div><b>Unit ' + l.unit + '. ' + esc(l.title) + '</b>' +
      '<div class="muted small">' + (sc ? sc.ok + ' из ' + sc.total + ' верно' : 'не начат') + '</div></div>' +
      (S.done[l.id] ? '<span class="badge ok">пройден</span>' : '<a class="badge" href="#play/' + l.id + '">продолжить</a>') + '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
  });

  if (days.length) html += '<p class="muted small">Занятий всего: ' + days.length + '. Верных ответов: ' + right + ' из ' + answered + '.</p>';
  $('#view').innerHTML = html;
}

/* ---------- тест ---------- */
let TEST = null;
function buildTestPool(blockId){
  const lessons = LESSONS.filter(l => l.block === blockId);
  if (!lessons.length) return null;
  const listening = [], written = [], homework = [];
  lessons.forEach(l => {
    l.exercises.forEach(ex => written.push({ ex, lesson:l }));
    (l.listening || []).forEach(ex => listening.push({ ex, lesson:l }));
    ((window.BOOK_EXERCISES || {})[l.id] || []).forEach(ex =>
      written.push({ ex:Object.assign({}, ex, { guide:ex.group }), lesson:l }));
    (l.homework || []).forEach(group => group.items.forEach(item => {
      homework.push({
        ex: {
          type:'fill', q:item.q, answers:item.a,
          explain:item.explain || 'Проверь порядок слов и форму глагола.',
          guide:group.task
        },
        lesson:l
      });
    }));
  });
  listening.sort(() => Math.random() - .5);
  written.sort(() => Math.random() - .5);
  homework.sort(() => Math.random() - .5);
  const regularSize = Math.ceil(TEST_SIZE / 2);
  const listenPart = listening.slice(0, 2);
  const regularPart = listenPart.concat(written.slice(0, regularSize - listenPart.length));
  const homeworkPart = homework.slice(0, TEST_SIZE - regularPart.length);
  return regularPart.concat(homeworkPart).sort(() => Math.random() - .5);
}
function renderTest(blockId){
  const pool = buildTestPool(blockId);
  if (!pool){ go('course'); return; }
  header('Тест');
  TEST = { blockId, pool, idx:0, right:0, total:0, attempts:0, firstTry:true, resolved:false, pick:null };
  renderTestCard();
}
function renderTestCard(){
  if (!TEST) { go('course'); return; }
  if (TEST.idx >= TEST.pool.length) return renderTestDone();
  const item = TEST.pool[TEST.idx], ex = item.ex;
  const pct = Math.round(TEST.idx * 100 / TEST.pool.length);
  let html = '<div class="player test-mode">' +
    '<div class="player-top"><button class="icon-btn" onclick="go(\'course\')" aria-label="Выйти">×</button>' +
    '<div class="player-progress"><i style="width:' + pct + '%"></i></div>' +
    '<span class="player-count">' + (TEST.idx + 1) + '/' + TEST.pool.length + '</span></div>' +
    '<div class="player-body"><span class="eyebrow">Тест блока</span>' +
    (ex.guide ? '<div class="test-guide">' + esc(ex.guide) + '</div>' : '') +
    '<h2 class="task-q">' + esc(ex.q) + '</h2>';
  if (ex.audio){
    html += '<div class="listen-row">' +
      '<button class="btn listen-big" data-speak="' + esc(ex.audio) + '">' + SPEAKER_ICON + '<span>Слушать</span></button>' +
      '<button class="btn ghost" data-speak="' + esc(ex.audio) + '" data-slow="1">Медленно</button></div>';
  }
  if (ex.type === 'choice'){
    html += '<div class="opts play-opts">' + ex.opts.map((o, i) =>
      '<button class="opt" data-pick="' + i + '">' + esc(o) + '</button>').join('') + '</div>';
  } else {
    html += '<input class="play-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="' +
      (ex.audio ? 'запиши услышанное' : 'ответ по-английски') + '">';
  }
  html += '<div class="fb play-fb" id="playFb" role="status" aria-live="polite"></div></div>' +
    '<div class="player-actions"><button class="btn primary xl" id="playCheck">Проверить</button></div></div>';
  $('#view').innerHTML = html;
  wireAudio($('#view'));
  const input = $('.play-input');
  if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') checkTest(); });
  if (ex.type === 'choice'){
    document.querySelectorAll('[data-pick]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (TEST.resolved) return;
        document.querySelectorAll('[data-pick]').forEach(b => b.classList.remove('sel'));
        btn.classList.add('sel');
        TEST.pick = Number(btn.dataset.pick);
      });
    });
  }
  $('#playCheck').addEventListener('click', checkTest);
}
function checkTest(){
  if (!TEST || TEST.resolved) return;
  const item = TEST.pool[TEST.idx], ex = item.ex;
  let ok = false, given = '', correct = '';
  if (ex.type === 'choice'){
    if (TEST.pick == null) return;
    given = ex.opts[TEST.pick];
    correct = ex.opts[ex.answer];
    ok = TEST.pick === ex.answer;
    if (!ok){
      const chosen = document.querySelectorAll('[data-pick]')[TEST.pick];
      if (chosen){ chosen.disabled = true; chosen.classList.add('bad'); }
      TEST.pick = null;
    }
  } else {
    const input = $('.play-input');
    given = input.value.trim();
    if (!given) return;
    ok = (ex.answers || ex.a || []).some(a => norm(a) === norm(given));
    correct = (ex.answers || ex.a || [])[0] || '';
    if (!ok) input.style.borderColor = '#5a2f2c';
  }
  if (ok) return resolveTest(item, ex, given, correct, true);
  TEST.attempts++;
  TEST.firstTry = false;
  if (TEST.attempts < MAX_TRIES){
    const fb = $('#playFb');
    fb.className = 'fb play-fb show no';
    const hint = ex.type === 'choice' ? 'Этот вариант не подходит. Попробуй другой.' : hintFor(correct, TEST.attempts);
    fb.innerHTML = '<b>Пока не так.</b> Попытка ' + TEST.attempts + ' из ' + MAX_TRIES + '.' +
      (hint ? '<br>' + esc(hint) : '');
    return;
  }
  resolveTest(item, ex, given, correct, false);
}
function resolveTest(item, ex, given, correct, ok){
  TEST.resolved = true;
  document.querySelectorAll('[data-pick]').forEach((b, i) => {
    b.disabled = true;
    if (i === ex.answer) b.classList.add('good');
  });
  const input = $('.play-input');
  if (input) input.disabled = true;
  TEST.total++;
  if (ok && TEST.firstTry) TEST.right++;
  if (!ok){
    const dup = S.errors.some(e => e.q === ex.q && e.date === today());
    if (!dup) S.errors.unshift({ date: today(), lesson:item.lesson.id, q:ex.q, given, correct });
  }
  markDay(); save(); refreshStreak();
  const fb = $('#playFb');
  fb.className = 'fb play-fb show ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? '<b>Верно.</b> ' + (TEST.firstTry ? '' : 'Но с подсказками — в зачёт не идёт. ') + esc(ex.explain || '')
    : 'Попытки закончились. Правильно: <span class="corr">' + esc(cap(correct)) + '</span>' +
      (ex.explain ? '<br>' + esc(ex.explain) : '');
  const actions = document.querySelector('.player-actions');
  actions.innerHTML = '<button class="btn primary xl" id="playNext">' +
    (TEST.idx + 1 >= TEST.pool.length ? 'Показать результат' : 'Дальше') + '</button>';
  $('#playNext').addEventListener('click', () => {
    TEST.idx++; TEST.attempts = 0; TEST.firstTry = true; TEST.resolved = false; TEST.pick = null; renderTestCard();
  });
  $('#playNext').focus();
}
function renderTestDone(){
  const pct = Math.round(TEST.right * 100 / TEST.pool.length);
  if (!S.tests) S.tests = {};
  S.tests[TEST.blockId] = { pct, right:TEST.right, total:TEST.pool.length, date:today() };
  save();
  $('#view').innerHTML = '<div class="player done"><div class="done-card">' +
    '<div class="done-badge">' + (pct >= 80 ? '✓' : '!') + '</div>' +
    '<h2 class="done-title">Тест блока</h2>' +
    '<div class="done-score">' + pct + '%</div>' +
    '<p class="muted">' + TEST.right + ' из ' + TEST.pool.length + ' верно</p>' +
    '<p class="small muted">' + (pct >= 80
      ? 'Порог взят: 80% или выше. Результат сохранён на главной.'
      : 'Нужно 80%. Результат сохранён; повтори ошибки и пройди тест ещё раз.') + '</p>' +
    '<button class="btn primary xl" onclick="renderTest(\'' + TEST.blockId + '\')">Пройти заново</button>' +
    '<a class="btn ghost full" href="#errors">Разобрать ошибки</a>' +
    '<a class="btn ghost full" href="#course">На главную</a>' +
    '</div></div>';
}

/* ---------- офлайн ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
prepareVoices();
loadAudioIndex();
LESSONS.forEach(l => {
  const sc = lessonScore(l.id);
  if (S.done[l.id] && (!sc || sc.total < lessonTotal(l) || sc.pct < 80)) delete S.done[l.id];
});
save();

/* старт */
route();
</script>
