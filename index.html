<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>English A0 → A2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header>
  <div class="title" id="hTitle">English</div>
  <div class="streak" id="hStreak"></div>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-go="course">
    <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H18a1 1 0 0 1 1 1v13"/><path d="M4 5.5V17a3 3 0 0 0 3 3h12"/><path d="M7 8h8"/></svg>
    Курс</button>
  <button data-go="dict">
    <svg viewBox="0 0 24 24"><path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5"/><path d="M8.5 13.5 11 18l2.5-4.5"/></svg>
    Словарь</button>
  <button data-go="errors">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v6"/><circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none"/></svg>
    Ошибки</button>
  <button data-go="progress">
    <svg viewBox="0 0 24 24"><path d="M4 17l5-6 4 4 7-8"/><path d="M20 7h-4M20 7v4"/></svg>
    Прогресс</button>
</nav>

<script src="data.js?v=3"></script>
<script>
/* ---------- хранилище ---------- */
const KEY = 'en_app_v1';
const blank = { done:{}, errors:[], log:{}, answers:{}, hw:{}, murphyAns:{}, given:{} };
let S = load();
function load(){
  try { return Object.assign({}, blank, JSON.parse(localStorage.getItem(KEY) || '{}')); }
  catch(e){ return JSON.parse(JSON.stringify(blank)); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function dayKey(d){
  const x = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return x.toISOString().slice(0,10);
}
function today(){ return dayKey(new Date()); }
function markDay(){ const d = today(); S.log[d] = (S.log[d] || 0) + 1; save(); }
function streak(){
  let n = 0;
  const d = new Date();
  if (!S.log[today()]) d.setDate(d.getDate()-1);
  for(;;){
    if (!S.log[dayKey(d)]) break;
    n++;
    d.setDate(d.getDate()-1);
    if (n > 400) break;
  }
  return n;
}

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function norm(s){
  return String(s).toLowerCase()
    .replace(/[’`]/g,"'")
    .replace(/[.,!?;:«»"]/g,'')
    .replace(/\s+/g,' ')
    .trim();
}
function lessonById(id){ return LESSONS.find(l => l.id === id); }
function allWords(){
  const seen = new Set(), out = [];
  LESSONS.forEach(l => (l.words||[]).forEach(w => {
    if (seen.has(w.w)) return; seen.add(w.w); out.push(Object.assign({lesson:l.title}, w));
  }));
  return out;
}
function lessonScore(id){
  const a = S.answers[id]; if(!a) return null;
  const total = Object.keys(a).length, ok = Object.values(a).filter(Boolean).length;
  return { total, ok, pct: total ? Math.round(ok*100/total) : 0 };
}
function hwItems(l){ return l.homework ? l.homework.reduce((s, b) => s + b.items.length, 0) : 0; }
function lessonTotal(l){ return l.exercises.length + hwItems(l); }

/* ---------- маршрутизация ---------- */
function go(view, param){
  location.hash = param ? view + '/' + param : view;
}
window.addEventListener('hashchange', route);
function route(){
  const parts = location.hash.replace(/^#/, '').split('/').filter(Boolean);
  const view = parts[0] || 'course';
  const param = parts[1];
  render(view, param);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.go === view));
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));

function header(title){
  $('#hTitle').textContent = title;
  const st = streak();
  $('#hStreak').innerHTML = st ? 'серия <b>' + st + '</b> дн.' : 'начни сегодня';
}

/* ---------- экраны ---------- */
function render(view, param){
  if (view === 'lesson') return renderLesson(param);
  if (view === 'dict') return renderDict();
  if (view === 'errors') return renderErrors();
  if (view === 'progress') return renderProgress();
  if (view === 'test') return renderTest(param);
  return renderCourse();
}

function renderCourse(){
  header('Курс');
  const all = LESSONS.length;
  const done = LESSONS.filter(l => S.done[l.id]).length;
  const pctAll = all ? Math.round(done * 100 / all) : 0;

  let html = '<h1>Английский с нуля</h1>' +
    '<p class="muted">Грамматика по Murphy, слова, слух и практика. Один урок — один юнит книги.</p>' +
    '<div class="card"><div class="row"><div><b>Курс A0 → A2</b>' +
    '<div class="muted small">6 блоков · 24 недели</div></div>' +
    '<span class="badge' + (done === all && all ? ' ok' : '') + '">' + done + ' из ' + all + '</span></div>' +
    '<div class="bar"><i style="width:' + pctAll + '%"></i></div></div>';

  BLOCKS.forEach(b => {
    const ls = LESSONS.filter(l => l.block === b.id);
    const okc = ls.filter(l => S.done[l.id]).length;
    const pct = ls.length ? Math.round(okc * 100 / ls.length) : 0;

    html += '<div class="card"><div class="row"><div><b>' + esc(b.title) + '</b>' +
      '<div class="muted small">' + esc(b.weeks) + ' · ' + esc(b.units) + '</div></div>' +
      '<span class="badge' + (ls.length && okc === ls.length ? ' ok' : '') + '">' + okc + '/' + ls.length + '</span></div>' +
      '<div class="muted small" style="margin-top:10px">' + esc(b.goal) + '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';

    if (!ls.length){
      html += '<p class="muted small">Уроки появятся, когда дойдём до блока.</p>';
      return;
    }

    ls.forEach(l => {
      const sc = lessonScore(l.id);
      const right = S.done[l.id]
        ? '<span class="badge ok">пройден' + (sc ? ' · ' + sc.pct + '%' : '') + '</span>'
        : (sc ? '<span class="badge">' + sc.pct + '%</span>' : '<span class="dim">→</span>');
      html += '<a class="card tap" href="#lesson/' + l.id + '"><div class="row">' +
        '<div><b>Unit ' + l.unit + '. ' + esc(l.title) + '</b>' +
        '<div class="muted small">' + esc(l.subtitle) + '</div></div>' + right + '</div></a>';
    });

    html += '<a class="btn full" href="#test/' + b.id + '">Тест по блоку · ' + TEST_SIZE + ' вопросов</a>';
  });

  $('#view').innerHTML = html;
}

function renderLesson(id){
  const l = lessonById(id);
  if (!l) { go('course'); return; }
  header('Unit ' + l.unit);
  let html = '<button class="back" onclick="go(\'course\')">← к курсу</button>';
  html += '<h1>Unit ' + l.unit + '. ' + esc(l.title) + '</h1><p class="muted">' + esc(l.subtitle) + '</p>';

  html += '<div class="chips">' +
    (l.murphy ? '<a class="chip" href="#s-murphy">Мерфи</a>' : '') +
    (l.murphy ? '<a class="chip" href="#s-homework">Домашка</a>' : '') +
    (l.homework ? '<a class="chip" href="#s-trainer">Тренажёр</a>' : '') +
    '<a class="chip" href="#s-words">Слова</a>' +
    '<a class="chip" href="#s-extra">Дополнительно</a></div>';

  if (l.murphy) html += '<div id="s-murphy">' + murphyBlock(l) + '</div>';

  const theory = l.sections || l.theory || [];
  html += '<div id="s-notes">';
  theory.forEach(t => {
    if (t.h) html += '<h2>' + esc(t.h) + '</h2>';
    if (t.p) html += '<p>' + t.p + '</p>';
    if (t.table){
      html += '<table><thead><tr>' + t.table[0].map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
        t.table.slice(1).map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') +
        '</tbody></table>';
    }
  });
  html += '</div>';

  html += '<h3 id="s-words">Слова урока</h3><div class="card">' + l.words.map(w =>
    '<div class="word"><div class="row"><span class="w">' + esc(w.w) + '</span><span class="tr">' + esc(w.tr) + '</span></div>' +
    '<div>' + esc(w.ru) + '</div><div class="ex2 muted">' + esc(w.ex) + ' — ' + esc(w.exRu) + '</div></div>').join('') + '</div>';

  html += '<h3>Примеры</h3><div class="card">' + l.examples.map(e =>
    '<div class="word"><div>' + esc(e.en) + '</div><div class="ex2 muted">' + esc(e.ru) + '</div></div>').join('') + '</div>';

  if (l.homework) html += trainerBlock(l);

  html += '<h2 id="s-extra">Дополнительно</h2><p class="muted small">Мои упражнения на те же темы. Пиши полностью, без сокращений.</p>';
  html += '<div id="exWrap"></div>';
  html += '<div id="trainWrap"></div>';
  html += '<div id="lessonEnd"></div>';
  $('#view').innerHTML = html;

  if (l.murphy) wireMurphy(l);

  const wrap = $('#exWrap');
  l.exercises.forEach((ex, i) => {
    const key = 'u' + i;
    const savedText = S.given && S.given[l.id + '|' + key];
    const savedOk = !!(S.answers[l.id] && S.answers[l.id][key]);
    const restore = savedText ? { given: savedText, ok: savedOk } : null;
    wrap.appendChild(exCard(ex, (ok, given, correct) => record(l.id, key, ok, ex, given, correct), restore));
  });

  if (l.homework){
    $('#trainWrap').innerHTML = '';
    wireTrainer(l);
  }

  const st = lessonScore(l.id);
  if (st && st.total >= lessonTotal(l)){
    $('#lessonEnd').innerHTML = '<div class="card"><b>Урок пройден: ' + st.pct + '%</b>' +
      '<p class="muted small">Можно вернуться завтра и пройти заново — вопросы те же.</p></div>';
  }
}

function exCard(ex, onAnswer, restore){
  const div = document.createElement('div');
  div.className = 'ex';
  div.innerHTML = '<p class="q">' + esc(ex.q) + '</p>';

  if (ex.type === 'choice'){
    div.innerHTML += '<div class="opts">' +
      ex.opts.map((o, i) => '<button class="opt" data-i="' + i + '">' + esc(o) + '</button>').join('') +
      '</div><div class="fb"></div>';
    div.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = Number(btn.dataset.i), right = i === ex.answer;
        div.querySelectorAll('.opt').forEach(b => b.classList.remove('sel'));
        btn.classList.add(right ? 'good' : 'bad');
        if (!right) div.querySelectorAll('.opt')[ex.answer].classList.add('good');
        showFb(div, right, ex.opts[ex.answer], ex.explain);
        onAnswer(right, ex.opts[i], ex.opts[ex.answer]);
      });
    });
    return div;
  }

  div.innerHTML += '<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ответ по-английски">' +
    '<div class="row" style="margin-top:8px"><button class="btn primary">Проверить</button></div><div class="fb"></div>';
  const inp = div.querySelector('input');
  const check = () => {
    const val = inp.value.trim();
    if (!val) return;
    const ok = ex.answers.some(a => norm(a) === norm(val));
    inp.style.borderColor = ok ? '#2e4a3a' : '#4a2e2e';
    showFb(div, ok, ex.answers[0], ex.explain);
    onAnswer(ok, val, ex.answers[0]);
  };
  div.querySelector('.btn').addEventListener('click', check);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  if (restore && restore.given){
    inp.value = restore.given;
    inp.style.borderColor = restore.ok ? '#2e4a3a' : '#4a2e2e';
    showFb(div, restore.ok, ex.answers[0], ex.explain);
  }
  return div;
}

function showFb(div, ok, correct, explain){
  const fb = div.querySelector('.fb');
  fb.className = 'fb show ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? '<b>Верно.</b> ' + esc(explain || '')
    : 'Не так. Правильно: <span class="corr">' + esc(cap(correct)) + '</span><br>' + esc(explain || '');
}
function cap(s){ return s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : s; }

function record(lessonId, key, ok, ex, given, correct){
  markAnswer(lessonId, key, ok, ex.q, given, correct);
}

function markAnswer(lessonId, key, ok, q, given, correct){
  if (!S.answers[lessonId]) S.answers[lessonId] = {};
  S.answers[lessonId][key] = ok;
  if (!S.given) S.given = {};
  S.given[lessonId + '|' + key] = given;
  if (!ok){
    const dup = S.errors.some(e => e.q === q && e.date === today());
    if (!dup) S.errors.unshift({ date: today(), lesson: lessonId, q, given, correct });
  }
  markDay();
  const l = lessonById(lessonId);
  if (l){
    const answered = Object.keys(S.answers[lessonId]).length;
    if (answered >= lessonTotal(l)) S.done[lessonId] = { date: today() };
  }
  save();
  refreshStreak();
}

function refreshStreak(){
  const st = streak();
  $('#hStreak').innerHTML = st ? 'серия <b>' + st + '</b> дн.' : 'начни сегодня';
}

/* ---------- Мерфи: страницы книги ---------- */
function murphyBlock(l){
  const m = l.murphy, n = l.unit;
  let html = '<h2>Мерфи: Unit ' + n + '</h2>' +
    '<p class="muted small">Страницы ' + esc(m.pages) + ' твоего издания. Тапни по странице, чтобы открыть крупно.</p>' +
    '<div class="card"><a href="' + m.theory + '" target="_blank" rel="noopener">' +
    '<img class="page" src="' + m.theory + '" alt="Murphy Unit ' + n + ', страница правила"></a></div>';

  html += '<h3 id="s-homework">Домашка по книге</h3>' +
    '<p class="muted small">Упражнения на странице ' + esc(m.exPage) + '. Пиши ответы здесь, потом сверься с ключом.</p>' +
    '<div class="card"><a href="' + m.ex + '" target="_blank" rel="noopener">' +
    '<img class="page" src="' + m.ex + '" alt="Упражнения Unit ' + n + '"></a></div>' +
    '<div class="card"><div class="muted small" style="margin-bottom:6px">Мои ответы</div>' +
    '<textarea id="mAns" rows="6" placeholder="1.1  she\'s …"></textarea>' +
    '<div class="row" style="margin-top:8px"><button class="btn" id="mKey">Показать ключ</button>' +
    '<span class="muted small" id="mSaved"></span></div>' +
    '<div id="keyWrap" style="display:none;margin-top:10px">' +
    m.key.map(k => '<a href="' + k + '" target="_blank" rel="noopener"><img class="page" style="margin-bottom:8px" src="' + k + '" alt="Ключ с ответами"></a>').join('') +
    '</div></div>';
  return html;
}

function wireMurphy(l){
  const ta = document.getElementById('mAns');
  if (!ta) return;
  ta.value = (S.murphyAns && S.murphyAns[l.id]) || '';
  let t = null;
  ta.addEventListener('input', () => {
    if (!S.murphyAns) S.murphyAns = {};
    S.murphyAns[l.id] = ta.value;
    save();
    const s = document.getElementById('mSaved');
    if (s) s.textContent = 'сохранено';
    clearTimeout(t);
    t = setTimeout(() => { if (s) s.textContent = ''; }, 1500);
  });
  document.getElementById('mKey').addEventListener('click', () => {
    const k = document.getElementById('keyWrap');
    const on = k.style.display !== 'none';
    k.style.display = on ? 'none' : 'block';
    document.getElementById('mKey').textContent = on ? 'Показать ключ' : 'Скрыть ключ';
  });
}

/* ---------- Тренажёр с проверкой ---------- */
function trainerBlock(l){
  let html = '<h2 id="s-trainer">Тренажёр</h2><p class="muted small">Те же темы, что в книге, но с проверкой прямо здесь.</p>';
  l.homework.forEach((blk, bi) => {
    html += '<div class="ex"><div class="row"><b>' + blk.id + ' · ' + esc(blk.task) + '</b>' +
      '<span class="badge" id="tb-' + bi + '"></span></div>' +
      '<div id="hwb-' + bi + '" style="margin-top:6px"></div></div>';
  });
  return html;
}

function wireTrainer(l){
  l.homework.forEach((blk, bi) => {
    const host = document.getElementById('hwb-' + bi);
    const badge = document.getElementById('tb-' + bi);
    const marks = [];
    if (badge) badge.textContent = '0 из ' + blk.items.length;

    blk.items.forEach((it, ii) => {
      const key = 'h' + blk.id + '.' + ii;
      const row = document.createElement('div');
      row.className = 'hwrow';
      row.innerHTML = '<div class="hwq">' + (ii + 1) + '. ' + esc(it.q) + '</div>' +
        '<div class="row"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ответ">' +
        '<button class="btn">ОК</button><span class="mark"></span></div><div class="fb"></div>';

      const inp = row.querySelector('input');
      const mark = row.querySelector('.mark');
      const fb = row.querySelector('.fb');
      const check = (silent) => {
        const v = inp.value.trim();
        if (!v) return;
        const ok = it.a.some(x => norm(x) === norm(v));
        inp.style.borderColor = ok ? '#2e4a3a' : '#4a2e2e';
        mark.textContent = ok ? '✓' : '✕';
        mark.style.color = ok ? 'var(--accent)' : 'var(--bad)';
        if (!ok){
          fb.className = 'fb show no';
          fb.innerHTML = 'Верно: <span class="corr">' + esc(cap(it.a[0])) + '</span>';
        } else if (it.sample){
          fb.className = 'fb show ok';
          fb.innerHTML = 'Образец: ' + esc(it.sample);
        } else {
          fb.className = 'fb';
        }
        marks[ii] = ok;
        const done = marks.filter(Boolean).length;
        if (badge){
          badge.textContent = done + ' из ' + blk.items.length;
          badge.className = 'badge' + (done === blk.items.length ? ' ok' : '');
        }
        if (!silent) markAnswer(l.id, key, ok, it.q, v, it.a[0]);
      };
      row.querySelector('.btn').addEventListener('click', () => check(false));
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(false); });
      host.appendChild(row);

      const saved = S.given && S.given[l.id + '|' + key];
      if (saved){ inp.value = saved; check(true); }
    });
  });
}

function renderDict(){
  header('Словарь');
  const words = allWords();
  let html = '<h1>Словарь</h1><p class="muted small">' + words.length + ' слов из уроков. Anki ведёшь отдельно, здесь просто справочник.</p>';
  html += '<input type="text" id="q" placeholder="поиск: слово или перевод" style="margin-bottom:6px">';
  html += '<div class="card" id="list">' + words.map(w =>
    '<div class="word" data-s="' + esc((w.w + ' ' + w.ru + ' ' + w.ex).toLowerCase()) + '">' +
    '<div class="row"><span class="w">' + esc(w.w) + '</span><span class="tr">' + esc(w.tr) + '</span></div>' +
    '<div>' + esc(w.ru) + '</div><div class="ex2 muted">' + esc(w.ex) + ' — ' + esc(w.exRu) + '</div></div>').join('') + '</div>';
  $('#view').innerHTML = html;
  $('#q').addEventListener('input', e => {
    const v = e.target.value.toLowerCase().trim();
    document.querySelectorAll('#list .word').forEach(el => {
      el.style.display = !v || el.dataset.s.includes(v) ? '' : 'none';
    });
  });
}

function renderErrors(){
  header('Ошибки');
  let html = '<h1>Ошибки</h1>';
  if (!S.errors.length){
    html += '<div class="empty">Пока пусто. Ошибки появятся здесь, когда начнёшь упражнения.</div>';
  } else {
    html += '<p class="muted small">' + S.errors.length + ' записей. Раз в неделю пробегай глазами.</p>';
    html += S.errors.map(e => '<div class="card"><div class="muted small">' + e.date + '</div>' +
      '<div style="margin-top:4px">' + esc(e.q) + '</div>' +
      '<div style="margin-top:6px">Ты: <span style="color:var(--bad)">' + esc(e.given) + '</span></div>' +
      '<div>Верно: <span style="color:var(--accent)">' + esc(cap(e.correct)) + '</span></div></div>').join('');
    html += '<button class="btn ghost full" onclick="clearErrors()">Очистить журнал</button>';
  }
  $('#view').innerHTML = html;
}
function clearErrors(){
  if (!confirm('Удалить все записи об ошибках?')) return;
  S.errors = []; save(); renderErrors();
}

function renderProgress(){
  header('Прогресс');
  const days = Object.keys(S.log).sort();
  let answered = 0, right = 0;
  Object.values(S.answers).forEach(o => Object.values(o).forEach(v => { answered++; if (v) right++; }));
  const doneLessons = Object.keys(S.done).length;
  const acc = answered ? Math.round(right*100/answered) : 0;

  let html = '<h1>Прогресс</h1><div class="kpi">' +
    '<div><b>' + streak() + '</b><span>дней подряд</span></div>' +
    '<div><b>' + doneLessons + '</b><span>уроков</span></div>' +
    '<div><b>' + acc + '%</b><span>верных</span></div></div>';

  html += '<h2>Последние 14 дней</h2><div class="grid14">';
  for (let i = 13; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const k = d.toISOString().slice(0,10);
    html += '<div class="day' + (S.log[k] ? ' on' : '') + '">' + d.getDate() + '</div>';
  }
  html += '</div>';

  html += '<h2>Уроки</h2>';
  LESSONS.forEach(l => {
    const sc = lessonScore(l.id);
    html += '<div class="card"><div class="row"><div><b>Unit ' + l.unit + '. ' + esc(l.title) + '</b>' +
      '<div class="muted small">' + (sc ? sc.ok + ' из ' + sc.total + ' верно' : 'не начат') + '</div></div>' +
      (S.done[l.id] ? '<span class="badge ok">пройден</span>' : '') + '</div></div>';
  });

  if (days.length) html += '<p class="muted small">Занятий всего: ' + days.length + '. Верных ответов: ' + right + ' из ' + answered + '.</p>';
  $('#view').innerHTML = html;
}

/* ---------- тест ---------- */
function renderTest(blockId){
  const lessons = LESSONS.filter(l => l.block === blockId);
  if (!lessons.length){ go('course'); return; }
  header('Тест');
  let pool = [];
  lessons.forEach(l => l.exercises.forEach(ex => pool.push({ ex, lesson:l })));
  pool = pool.sort(() => Math.random() - .5).slice(0, TEST_SIZE);

  let html = '<button class="back" onclick="go(\'course\')">← к курсу</button>' +
    '<h1>Тест по блоку</h1><p class="muted small">' + pool.length + ' вопросов. Без подсказок, правила не подглядывай.</p>' +
    '<div class="row"><span class="muted small" id="tProg">0 из ' + pool.length + '</span>' +
    '<span class="muted small" id="tAcc"></span></div>' +
    '<div id="exWrap"></div><div id="testEnd"></div>';
  $('#view').innerHTML = html;
  const wrap = $('#exWrap');
  let right = 0, answered = 0;

  pool.forEach(item => {
    wrap.appendChild(exCard(item.ex, (ok, given, correct) => {
      answered++; if (ok) right++;
      $('#tProg').textContent = answered + ' из ' + pool.length;
      $('#tAcc').textContent = answered ? Math.round(right*100/answered) + '%' : '';
      if (!ok){
        const dup = S.errors.some(e => e.q === item.ex.q && e.date === today());
        if (!dup) S.errors.unshift({ date: today(), lesson: item.lesson.id, q: item.ex.q, given, correct });
      }
      markDay(); save(); refreshStreak();
      if (answered === pool.length){
        const pct = Math.round(right*100/pool.length);
        $('#testEnd').innerHTML = '<div class="card"><div class="muted small">Результат</div>' +
          '<div class="score">' + pct + '%</div><div>' + right + ' из ' + pool.length + ' верно</div>' +
          '<p class="muted small">' + (pct >= 80
            ? 'Блок можно считать пройденным.'
            : pct >= 50
              ? 'Половина сидит. Повтори слабые уроки и пройди ещё раз.'
              : 'Рано. Возвращайся в уроки, тест пока не про тебя.') + '</p>' +
          '<button class="btn full" onclick="renderTest(\'' + blockId + '\')">Пройти заново</button></div>';
      }
    }));
  });
}

/* ---------- офлайн ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* старт */
route();
</script>
